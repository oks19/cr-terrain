<style>
:root { --blue:#0b4f8a; --green:#1e8a4c; --red:#c0392b; --brown:#8a5a1e; --bg:#f2f5f8; --line:#d5dde6; --txt:#1d2733; --mut:#5b6b7c; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; background:var(--bg); color:var(--txt); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size:16px; }
header.bar { padding-top: max(12px, env(safe-area-inset-top)) !important; }
header.bar { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:12px 14px; display:flex; align-items:center; gap:10px; min-height:54px; }
header.bar h1 { font-size:17px; margin:0; flex:1; line-height:1.2; }
header.bar button { background:rgba(255,255,255,.15); color:#fff; border:0; border-radius:8px; padding:8px 10px; font-size:15px; }
main { padding:14px; max-width:640px; margin:0 auto; padding-bottom:110px; }
.card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
.site { display:flex; align-items:center; gap:12px; cursor:pointer; }
.site .nro { font-weight:800; font-size:19px; color:var(--blue); min-width:68px; }
.site .addr { flex:1; font-size:14px; color:var(--mut); line-height:1.3; }
.pill { display:inline-block; font-size:12px; font-weight:700; padding:4px 9px; border-radius:20px; color:#fff; white-space:nowrap; }
.p-todo { background:#8796a5; } .p-progress { background:#d68910; } .p-done { background:var(--green); } .p-nok { background:var(--red); }
.muted { color:var(--mut); font-size:14px; }
h2 { font-size:15px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); margin:18px 2px 8px; }
.btn { display:block; width:100%; border:0; border-radius:12px; padding:16px; font-size:17px; font-weight:700; color:#fff; background:var(--blue); margin-top:10px; }
.btn.green { background:var(--green); } .btn.red { background:var(--red); } .btn.ghost { background:#fff; color:var(--blue); border:2px solid var(--blue); }
.btn:disabled { opacity:.4; }
a.btn { text-align:center; text-decoration:none; box-sizing:border-box; }
.btn.fir { margin:0 0 14px; background:#fff7ec; color:#a24d00; border:2px solid #f0a050; }
.row { display:flex; gap:10px; } .row > * { flex:1; }
.footer { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }
.footer .inner { max-width:640px; margin:0 auto; }
.footer .btn { margin-top:0; }
.progress { height:8px; background:#dde4eb; border-radius:4px; overflow:hidden; margin:4px 0 12px; }
.progress > div { height:100%; background:var(--green); transition:width .3s; }
.phase { display:inline-block; font-weight:800; font-size:13px; letter-spacing:.1em; color:#fff; padding:4px 10px; border-radius:6px; margin-bottom:8px; }
.ph-avant { background:var(--brown); } .ph-apres { background:var(--green); } .ph-inter { background:var(--blue); } .ph-nok { background:var(--red); }
.step-title { font-size:22px; font-weight:800; margin:2px 0 6px; }
.photo-box { margin-top:12px; border:2px dashed var(--line); border-radius:12px; min-height:240px; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#fafbfc; }
.photo-box img { width:100%; max-height:60vh; object-fit:contain; display:block; }
.thumbs { display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; }
.thumb { position:relative; aspect-ratio:3/4; background:#e8edf2; border-radius:8px; overflow:hidden; border:2px solid transparent; }
.thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.thumb span { position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,.6); color:#fff; font-size:10px; padding:3px; line-height:1.2; text-align:center; }
.thumb.missing { border-color:var(--red); }
.preview img { width:100%; display:block; border:1px solid var(--line); border-radius:6px; margin-bottom:10px; box-shadow:0 2px 6px rgba(0,0,0,.08); }
label { display:block; font-weight:700; font-size:14px; margin:12px 0 5px; }
input[type=text], input[type=password], select, textarea { width:100%; font-size:16px; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; font-family:inherit; }
.info td { padding:3px 0; vertical-align:top; font-size:15px; } .info td:first-child { color:var(--mut); padding-right:12px; white-space:nowrap; }
.link { background:none; border:0; color:var(--blue); font-size:15px; text-decoration:underline; padding:8px 0; }
.link.red { color:var(--red); }
.busy { position:fixed; inset:0; background:rgba(11,79,138,.85); color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; z-index:50; text-align:center; padding:30px; }
.hidden { display:none !important; }
.langs { display:flex; gap:2px; background:rgba(255,255,255,.15); border-radius:8px; padding:2px; }
header.bar .langs button.lang { background:none; padding:6px 8px; font-size:13px; font-weight:700; opacity:.65; }
header.bar .langs button.lang.on { background:#fff; color:var(--blue); opacity:1; }
a.nav { display:block; text-align:center; text-decoration:none; background:#eef3f8; color:var(--blue); font-weight:700; border-radius:10px; padding:12px 4px; font-size:14px; border:1px solid var(--line); white-space:nowrap; }
.row:has(> a.nav) { gap:6px; }
.card.acces { border-left:5px solid #d68910; }
.acces-t { font-weight:800; margin-bottom:6px; }
.acces-txt { white-space:pre-line; font-size:15px; line-height:1.45; }
.alerte { margin-top:6px; background:#fff1e0; color:#c25e00; border:1px solid #f0a050; border-radius:6px; padding:4px 7px; font-size:13px; font-weight:800; line-height:1.3; }
.alerte.big { margin-top:10px; font-size:15px; padding:9px 11px; }
.note { margin-top:10px; background:#fdf2e3; color:#8a5a1e; border-radius:8px; padding:8px 10px; font-size:14px; font-weight:600; }
.site .note { margin-top:4px; padding:2px 6px; font-size:12px; display:inline-block; }
</style>
</head>

// Fusion du planning déchiffré : met à jour adresses / GPS / accès sans perdre l'avancement
function applyPlanning(list) {
  list.forEach((p, i) => {
    const ex = sites.find(s => s.nro === p.nro);
    if (ex) Object.assign(ex, p, { datePlan: ex.datePlan || p.datePlan });
    else sites.splice(Math.min(i, sites.length), 0, { ...p, status:'todo', step:0 });
  });
  // L'ordre suit le planning publié ; les sites ajoutés à la main restent à la fin
  const rank = new Map(list.map((p, i) => [p.nro, i]));
  sites.sort((a, b) => (rank.has(a.nro) ? rank.get(a.nro) : 1e6) - (rank.has(b.nro) ? rank.get(b.nro) : 1e6));
  save();
}
const save = () => localStorage.setItem(LS_KEY, JSON.stringify(sites));

let dbP = null;
function db() {
  if (!dbP) dbP = new Promise((res, rej) => {
    const r = indexedDB.open('crj_photos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('p');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbP;
}
async function idb(mode, fn) {
  const d = await db();
  return new Promise((res, rej) => { const tx = d.transaction('p', mode); const req = fn(tx.objectStore('p')); tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error); });
}
const putPhoto = (nro, k, blob) => idb('readwrite', s => s.put(blob, nro + ':' + k));
const getPhoto = (nro, k) => idb('readonly', s => s.get(nro + ':' + k));
const delPhoto = async (nro, k) => { await idb('readwrite', s => s.delete(nro + ':' + k)); await idb('readwrite', s => s.delete(nro + ':' + k + '.o')); };

const urlCache = {};
async function photoURL(nro, k) {
  const key = nro + ':' + k;
  if (urlCache[key]) return urlCache[key];
  const b = await getPhoto(nro, k);
  if (!b) return null;
  return (urlCache[key] = URL.createObjectURL(b));
}
function dropURL(nro, k) { const key = nro + ':' + k; if (urlCache[key]) { URL.revokeObjectURL(urlCache[key]); delete urlCache[key]; } }

// Prise de photo : ouvre l'appareil, réduit à 2048 px (qualité 85 %), stocke en JPEG – c'est aussi la photo du ZIP
function takePhoto(gallery = false) {
  return new Promise(resolve => {
    const inp = document.getElementById('cam');
    inp.value = '';
    if (gallery) inp.removeAttribute('capture'); else inp.setAttribute('capture', 'environment');
    inp.onchange = async () => {
      const f = inp.files && inp.files[0];
      if (!f) return resolve(null);
      busy(t('saving'));
      try { resolve(await shrink(f, 2048, 0.85)); } catch (e) { alert(t('badPhoto') + e.message); resolve(null); } finally { busy(''); }
    };
    inp.click();
  });
}
async function loadImage(blob) {
  if (window.createImageBitmap) { try { return await createImageBitmap(blob, { imageOrientation:'from-image' }); } catch (e) {} }
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('format')); i.src = URL.createObjectURL(blob); });
}
async function shrink(file, max, q) {
  const img = await loadImage(file);
  const r = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', q));
}

const NOK_CAP = { nok:'Constat', nok_site:'Vue globale du site', nok_arr:'Baie face arrière' };

function downloadBlob(blob, name) {

// Android : copie automatique dans « Téléchargements » de chaque photo prise avec l'appareil
function autoBackup(s, k, blob, gallery) { if (!IS_IOS && !gallery) { try { downloadBlob(blob, photoName(s, k, blob)); } catch (e) {} } }
let crPhotos = [];
async function loadCrPhotos(s) {
  const keys = s.status === 'nok' ? nokList(s).map(p => p.k) : PHOTO_STEPS.map(p => p.k);
  crPhotos = [];
  for (const k of keys) {

/* ---- ZIP (sans compression : les photos le sont déjà) ---- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let i = 0; i < 256; i++) { let c = i; for (let j = 0; j < 8; j++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[i] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
async function makeZip(entries) { // entries : [{ name, blob }]
  const enc = new TextEncoder(), parts = [], central = [];
  const d = new Date(), dt = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)), dd = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate());
  let off = 0;
  for (const e of entries) {
    const data = new Uint8Array(await e.blob.arrayBuffer()), nm = enc.encode(e.name), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, dt, 2], [12, dd, 2], [14, crc, 4], [18, data.length, 4], [22, data.length, 4], [26, nm.length, 2], [28, 0, 2]]
      .forEach(([o, v, l]) => l === 4 ? lh.setUint32(o, v, true) : lh.setUint16(o, v, true));
    const ch = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, dt, 2], [14, dd, 2], [16, crc, 4], [20, data.length, 4], [24, data.length, 4], [28, nm.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, off, 4]]
      .forEach(([o, v, l]) => l === 4 ? ch.setUint32(o, v, true) : ch.setUint16(o, v, true));
    parts.push(lh.buffer, nm, data); central.push(ch.buffer, nm);
    off += 30 + nm.length + data.length;
  }
  const cdSize = central.reduce((a, b) => a + b.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  [[0, 0x06054b50, 4], [8, entries.length, 2], [10, entries.length, 2], [12, cdSize, 4], [16, off, 4]]
    .forEach(([o, v, l]) => l === 4 ? end.setUint32(o, v, true) : end.setUint16(o, v, true));
  return new Blob([...parts, ...central, end.buffer], { type:'application/zip' });
}
async function savePhotos() {
  if (!crPhotos.length) return alert(t('savePhNone'));

}

function downloadPdf() {

  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

async function shareZip() {
  // iPhone : le ZIP part directement (WhatsApp, Mail…)

/* ============================================================
   Mise en page PDF (A4, 150 dpi) – identique aux CR existants
   ============================================================ */
const DPI = 150, MM = DPI / 25.4, PT = DPI / 72;
const W = Math.round(210 * MM), H = Math.round(297 * MM);
const C = { blue:'#0b4f8a', green:'#1e8a4c', red:'#c0392b', brown:'#8a5a1e', txt:'#1d2733', mut:'#5b6b7c', line:'#cfd8e2', soft:'#eef3f8', cap:'#36475a', motif:'#a12a1f' };
const FONT = "'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif";
const mm = v => v * MM;
const font = (size, weight = 400) => `${weight} ${size * PT}px ${FONT}`;

function newPage() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.textBaseline = 'alphabetic';
  return [c, x];
}
function rrect(x, X, Y, w, h, r) { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }

const L = mm(12), R = W - mm(12), CW = R - L;

function drawHeader(x, s, sub) {
  let y = mm(12);
  x.fillStyle = C.mut; x.font = font(8.5); x.fillText("COMPTE RENDU D'INTERVENTION", L, y + 8.5 * PT);
  x.fillStyle = C.blue; x.font = font(17, 700); x.fillText('Installation électrique – Switch Juniper', L, y + 8.5 * PT + mm(1) + 17 * PT);
  const hh = 8.5 * PT + mm(1) + 17 * PT + mm(1.5);
  x.font = font(18, 700); const tw = x.measureText(s.nro).width;
  const bw = tw + mm(10), bh = 18 * PT + mm(4);
  x.fillStyle = C.blue; rrect(x, R - bw, y + (hh - bh) / 2, bw, bh, mm(2)); x.fill();
  x.fillStyle = '#fff'; x.textBaseline = 'middle'; x.fillText(s.nro, R - bw + mm(5), y + hh / 2 + 1); x.textBaseline = 'alphabetic';
  y += hh + mm(3);
  x.fillStyle = C.blue; x.fillRect(L, y, CW, mm(0.8)); y += mm(0.8);
  if (sub) { x.fillStyle = C.mut; x.font = font(9); x.fillText(sub, L, y + mm(1.5) + 9 * PT); y += mm(1.5) + 9 * PT + mm(1); }
  return y;
}

function drawTable(x, y, s, statut, motif) {
  y += mm(3.5);
  const rh = mm(7), pad = mm(2.5);
  x.font = font(9.5, 600);
  const k1 = Math.max(...['Site (NRO)', 'Adresse', 'Prestation', 'Motif'].map(t => x.measureText(t).width)) + 2 * pad;
  const k2 = x.measureText("Date d'intervention").width + 2 * pad;
  x.font = font(9.5, 700);
  const badgeW = x.measureText(statut.txt).width + mm(6);
  x.font = font(9.5);
  const v2 = Math.max(x.measureText(s.dateInter || '').width, badgeW) + 2 * pad;
  const v1 = CW - k1 - k2 - v2;
  const cols = [L, L + k1, L + k1 + v1, L + k1 + v1 + k2, R];
  const rows = [
    [['Site (NRO)', 'k'], [s.nro], ["Date d'intervention", 'k'], [s.dateInter || '']],
    [['Adresse', 'k'], [`${s.adresse} – ${s.cp} ${s.ville}`.replace(/^ – /, '')], ['Statut', 'k'], [statut, 'badge']],
    [['Prestation', 'k'], ['Raccordement électrique du switch Juniper dans la baie', 'span']],
  ];
  if (motif) rows.push([['Motif', 'k'], [motif, 'span motif']]);
  rows.forEach((row, ri) => {
    const ry = y + ri * rh;
    let ci = 0;
    row.forEach(([val, kind = '']) => {
      const span = kind.includes('span') ? 3 : 1;
      const cx = cols[ci], cw = cols[ci + span] - cx;
      if (kind === 'k') { x.fillStyle = C.soft; x.fillRect(cx, ry, cw, rh); }
      x.strokeStyle = C.line; x.lineWidth = 2; x.strokeRect(cx, ry, cw, rh);
      x.textBaseline = 'middle';
      if (kind === 'badge') {
        x.font = font(9.5, 700); const bw = x.measureText(val.txt).width + mm(6), bh = mm(4.6);
        x.fillStyle = val.color; rrect(x, cx + pad, ry + (rh - bh) / 2, bw, bh, mm(1)); x.fill();
        x.fillStyle = '#fff'; x.fillText(val.txt, cx + pad + mm(3), ry + rh / 2 + 1);
      } else {
        x.font = font(9.5, kind === 'k' || kind.includes('motif') ? 600 : 400);
        x.fillStyle = kind.includes('motif') ? C.motif : C.txt;
        x.fillText(fit(x, String(val), cw - 2 * pad), cx + pad, ry + rh / 2 + 1);
      }
      x.textBaseline = 'alphabetic';
      ci += span;
    });
  });
  return y + rows.length * rh + mm(1);
}
function fit(x, t, w) { if (x.measureText(t).width <= w) return t; while (t.length > 1 && x.measureText(t + '…').width > w) t = t.slice(0, -1); return t + '…'; }

function drawH2(x, y, txt, color) {
  y += mm(3); const h = mm(7);
  x.fillStyle = C.soft; x.fillRect(L, y, CW, h);
  x.fillStyle = color; x.fillRect(L, y, mm(1.1), h);
  x.fillStyle = C.txt; x.font = font(11, 700); x.textBaseline = 'middle'; x.fillText(txt, L + mm(3), y + h / 2 + 1); x.textBaseline = 'alphabetic';
  return y + h + mm(2);
}

function drawImg(x, img, X, Y, w, h, mode) {
  let sx = 0, sy = 0, sw = img.width, sh = img.height, dx = X, dy = Y, dw = w, dh = h;
  if (mode === 'cover') {
    const r = Math.max(w / sw, h / sh); const cw = w / r, ch = h / r; sx = (sw - cw) / 2; sy = (sh - ch) / 2; sw = cw; sh = ch;
  } else { const r = Math.min(w / sw, h / sh); dw = sw * r; dh = sh * r; dx = X + (w - dw) / 2; dy = Y + (h - dh) / 2; }
  x.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
  x.strokeStyle = C.line; x.lineWidth = 2; x.strokeRect(dx, dy, dw, dh);
  return { dx, dy, dw, dh };
}
function drawFig(x, img, X, Y, w, h, caption, tag, mode = 'cover') {
  const r = drawImg(x, img, X, Y, w, h, mode);
  if (tag) {
    const txt = tag === 'av' ? 'AVANT' : 'APRÈS';
    x.font = font(9.5, 700); const bw = x.measureText(txt).width + mm(6), bh = mm(5.2);
    x.save(); x.shadowColor = 'rgba(0,0,0,.4)'; x.shadowBlur = mm(2);
    x.fillStyle = tag === 'av' ? C.brown : C.green; rrect(x, r.dx + mm(2), r.dy + mm(2), bw, bh, mm(1)); x.fill(); x.restore();
    x.fillStyle = '#fff'; x.textBaseline = 'middle'; x.fillText(txt, r.dx + mm(5), r.dy + mm(2) + bh / 2 + 1); x.textBaseline = 'alphabetic';
  }
  x.fillStyle = C.cap; x.font = font(9, 600); x.textAlign = 'center';
  x.fillText(caption, X + w / 2, r.dy + r.dh + mm(0.8) + 9 * PT);
  x.textAlign = 'left';
  return r.dy + r.dh + mm(0.8) + 9 * PT + mm(1);
}

async function buildPages(s) {
  const pages = [];
  if (s.status === 'nok') {
    const m = MOTIFS[s.motif] || MOTIFS.autre;
    const figs = [];
    for (const p of nokList(s)) {
      const b = await getPhoto(s.nro, p.k);
      if (b) figs.push({ img: await loadImage(b), cap: p.cap || s.legende });
    }
    const [c, x] = newPage();
    let y = drawHeader(x, s, '');
    y = drawTable(x, y, s, { txt:'NON FAIT', color:C.red }, s.motifTxt);
    y = drawH2(x, y, m.constat, C.red);
    const hAvail = Math.min(mm(190), H - mm(12) - y - mm(6));
    const colW = (CW - mm(5)) / 2;
    if (figs.length === 1) drawFig(x, figs[0].img, L, y, CW, hAvail, figs[0].cap, null, 'contain');
    else {
      const boxH = Math.min(hAvail, colW * 4 / 3); // format photo portrait 3:4, collé sous le titre
      figs.slice(0, 2).forEach((fg, i) => drawFig(x, fg.img, L + i * (colW + mm(5)), y, colW, boxH, fg.cap, null, 'contain'));
    }
    pages.push(c);
    // Photos suivantes : 4 par page (2 × 2)
    for (let i = 2; i < figs.length; i += 4) {
      const [c2, x2] = newPage();
      let y2 = drawHeader(x2, s, `${s.adresse} – ${s.cp} ${s.ville} · ${s.dateInter || ''}`);
      y2 = drawH2(x2, y2, m.constat + ' – suite', C.red);
      const cellH = (H - mm(12) - y2 - mm(6) - mm(16)) / 2;
      figs.slice(i, i + 4).forEach((fg, j) => drawFig(x2, fg.img, L + (j % 2) * (colW + mm(5)), y2 + Math.floor(j / 2) * (cellH + mm(8)), colW, cellH, fg.cap, null, 'contain'));
      pages.push(c2);
    }
    return pages;
  }
  const im = {};
  for (const p of PHOTO_STEPS) im[p.k] = await loadImage(await getPhoto(s.nro, p.k));
  const colW = (CW - mm(5)) / 2;
  const bigW = mm(72), bigH = mm(96);

  // Page 1 : infos + face avant / face arrière, avant à gauche, après à droite
  let [c, x] = newPage();
  let y = drawHeader(x, s, '');
  y = drawTable(x, y, s, { txt:'FAIT – OK', color:C.green });
  for (const [titre, av, ap] of [['Face avant – avant / après', 'av_face', 'ap_face_ouv'], ['Face arrière – avant / après', 'av_arr', 'ap_arr_ouv']]) {
    y = drawH2(x, y, titre, C.blue);
    const y1 = drawFig(x, im[av], L + (colW - bigW) / 2, y, bigW, bigH, STEP[av].cap, 'av');
    drawFig(x, im[ap], L + colW + mm(5) + (colW - bigW) / 2, y, bigW, bigH, STEP[ap].cap, 'ap');
    y = y1;
  }
  pages.push(c);

  // Page 2 : raccordement / lovage en haut, portes fermées en bas
  [c, x] = newPage();
  y = drawHeader(x, s, `${s.adresse} – ${s.cp} ${s.ville} · ${s.dateInter || ''}`);
  y = drawH2(x, y, 'Autres vues après intervention', C.green);
  const midH = mm(102);
  for (const pair of [['ap_zoom', 'ap_lovage'], ['ap_face_ferm', 'ap_arr_ferm']]) {
    const y1 = drawFig(x, im[pair[0]], L, y, colW, midH, STEP[pair[0]].cap);
    drawFig(x, im[pair[1]], L + colW + mm(5), y, colW, midH, STEP[pair[1]].cap);
    y = y1 + mm(3);
  }
  pages.push(c);
  return pages;
}

/* ---- Écriture du fichier PDF (une image JPEG pleine page par page) ---- */
async function makePdf(canvases) {
  const enc = new TextEncoder(), parts = [], offs = []; let pos = 0;
  const push = d => { const b = typeof d === 'string' ? enc.encode(d) : d; parts.push(b); pos += b.length; };
  push('%PDF-1.4\n'); push(new Uint8Array([37, 226, 227, 207, 211, 10]));
  const n = canvases.length, total = 2 + 3 * n;
  const obj = (id, body) => { offs[id] = pos; push(`${id} 0 obj\n`); body(); push('\nendobj\n'); };
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push(`<< /Type /Pages /Count ${n} /Kids [${canvases.map((_, i) => `${3 + 3 * i} 0 R`).join(' ')}] >>`));
  for (let i = 0; i < n; i++) {
    const cv = canvases[i];
    const jpg = new Uint8Array(await (await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85))).arrayBuffer());
    const pid = 3 + 3 * i, cid = pid + 1, iid = pid + 2;
    const content = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(pid, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));
    obj(cid, () => push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`));
    obj(iid, () => { push(`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`); push(jpg); push('\nendstream'); });
  }
  const xref = pos;
  push(`xref\n0 ${total + 1}\n0000000000 65535 f \n`);
  for (let i = 1; i <= total; i++) push(String(offs[i]).padStart(10, '0') + ' 00000 n \n');
  push(`trailer\n<< /Size ${total + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, { type:'application/pdf' });
}

/* ============================================================
   Connexion : les données des sites sont chiffrées (AES-GCM).
   Chaque compte possède une clé dérivée de son mot de passe (PBKDF2)
   qui déverrouille la clé des données. La clé du compte est mémorisée
   sur le téléphone : on ne se reconnecte que si l'accès change.
   ============================================================ */
const SESS_KEY = 'crj_session_v1';
let session = null;
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const subtle = () => { if (!window.crypto || !crypto.subtle) throw new Error('crypto'); return crypto.subtle; };

async function userId(login) {
  const d = await subtle().digest('SHA-256', new TextEncoder().encode('crj:' + login.trim().toLowerCase()));
  return b64e(d).slice(0, 22);
}
async function deriveKek(password, saltB64) {
  const base = await subtle().importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  return subtle().deriveBits({ name:'PBKDF2', hash:'SHA-256', salt:b64d(saltB64), iterations:SEC.iter }, base, 256);
}
/* ---- FIR : document chiffré, lisible seulement après connexion ---- */
let DATA_KEY = null, firURL = null;
async function prepareDocs() {
  if (firURL || !DATA_KEY || !SEC || !SEC.docs || !SEC.docs.length) return;
  try {
    const d = SEC.docs[0];
    const ct = await (await fetch(d.file)).arrayBuffer();
    const pt = await subtle().decrypt({ name:'AES-GCM', iv:b64d(d.iv) }, DATA_KEY, ct);
    firURL = URL.createObjectURL(new Blob([pt], { type:'application/pdf' }));
    if (rerender === renderPlanning) renderPlanning();
  } catch (e) { console.warn('FIR', e); }
}
function firButton() {
  if (!SEC || !SEC.docs || !SEC.docs.length) return '';
  if (!firURL) return `<div class="btn fir" style="opacity:.6">${t('firWait')}</div>`;
  // iPhone : ouverture dans le lecteur PDF (avec Partager) ; Android : téléchargé avec son nom
  return `<a class="btn fir" href="${firURL}" target="_blank" rel="noopener" ${IS_IOS ? '' : `download="${esc(SEC.docs[0].name)}"`}>${t('fir')}</a>`;
}
async function openData(id, kekRaw) {
  const u = SEC.users[id];
  if (!u) throw new Error('compte');
  const kek = await subtle().importKey('raw', kekRaw, 'AES-GCM', false, ['decrypt']);
  const dk = await subtle().decrypt({ name:'AES-GCM', iv:b64d(u.iv) }, kek, b64d(u.wk));
  const key = await subtle().importKey('raw', dk, 'AES-GCM', false, ['decrypt']);
  DATA_KEY = key;
  const pt = await subtle().decrypt({ name:'AES-GCM', iv:b64d(SEC.data.iv) }, key, b64d(SEC.data.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

async function init() {
  registerSW();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  const saved = JSON.parse(localStorage.getItem(SESS_KEY) || 'null');
  if (saved && SEC) {
    try {
      const data = await openData(saved.id, b64d(saved.kek));
      session = saved; applyPlanning(data.sites); prepareDocs(); return renderPlanning();
    } catch (e) { localStorage.removeItem(SESS_KEY); return renderLogin('login_exp'); }
  }
  renderLogin();
}

function renderLogin(msg) {
  rerender = () => renderLogin(msg);
  $app.innerHTML = bar(t('app')) + `<main>
    <div class="card" style="margin-top:20px">
      <div class="step-title" style="margin-bottom:12px">${t('login_t')}</div>
      ${msg ? `<div class="note" style="margin-bottom:8px">${esc(t(msg))}</div>` : ''}
      <form onsubmit="event.preventDefault();doLogin()">
        <label>${t('login_user')}</label><input type="text" id="l_user" autocapitalize="none" autocorrect="off" autocomplete="username" spellcheck="false">
        <label>${t('login_pw')}</label><input type="password" id="l_pw" autocomplete="current-password">
        <div id="l_err" style="color:var(--red);font-weight:600;margin-top:10px"></div>
        <button class="btn" id="l_btn" type="submit">${t('login_btn')}</button>
      </form>
      <div class="muted" style="margin-top:10px">${t('login_hint')}</div>
    </div>
    ${installCard()}
  </main>`;
}
async function doLogin() {
  const login = document.getElementById('l_user').value.trim();
  const pw = document.getElementById('l_pw').value;
  const err = document.getElementById('l_err'), btn = document.getElementById('l_btn');
  err.textContent = ''; btn.disabled = true; btn.textContent = t('login_wait');
  try {
    if (!SEC) throw new Error('data');
    const id = await userId(login);
    const u = SEC.users[id];
    if (!u || !pw) throw new Error('compte');
    const kekRaw = await deriveKek(pw, u.salt);
    const data = await openData(id, kekRaw);
    session = { id, login, kek: b64e(kekRaw) };
    localStorage.setItem(SESS_KEY, JSON.stringify(session));
    applyPlanning(data.sites);
    prepareDocs();
    renderPlanning();
  } catch (e) {
    err.textContent = t('login_err'); btn.disabled = false; btn.textContent = t('login_btn');
  }
}
function logout() {
  if (!confirm(t('logoutQ'))) return;
  localStorage.removeItem(SESS_KEY); session = null;
  DATA_KEY = null; if (firURL) { URL.revokeObjectURL(firURL); firURL = null; }
  // Retire les infos des sites du planning (adresses, accès) ; l'avancement et les photos restent
  sites = sites.filter(s => s.status !== 'todo' || s.local);
  save(); renderLogin();
}

/* ---- Installation (écran d'accueil) + hors-ligne ---- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (rerender) rerender(); });
window.addEventListener('appinstalled', () => { installEvt = null; if (rerender) rerender(); });
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function installCard() {
  // Pas d'incitation à installer : l'appli s'utilise directement depuis le lien (Safari / Chrome).
  // Le technicien peut toujours faire « Sur l'écran d'accueil » lui-même s'il le souhaite.
  return '';
  if (isStandalone() || location.protocol === 'file:') return '';
  if (installEvt) return `<button class="btn green" onclick="doInstall()">${t('inst_btn')}</button>`;
  return `<div class="card muted" style="margin-top:12px">${IS_IOS ? t('inst_ios') : t('inst_other')}</div>`;
}
async function doInstall() { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; rerender(); }
function registerSW() {
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    const hadSW = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(reg => {
      const check = () => reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
      setInterval(check, 5 * 60 * 1000);
    }).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW) showUpdate(); });
  }
}
function showUpdate() {
  if (document.getElementById('upd')) return;
  const b = document.createElement('button');
  b.id = 'upd'; b.textContent = t('newVer'); b.onclick = () => location.reload();
  b.style.cssText = 'position:fixed;left:10px;right:10px;top:10px;z-index:99;padding:14px;border:0;border-radius:12px;background:#0b4f8a;color:#fff;font-size:16px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.3)';
  document.body.appendChild(b);
}

init();
</script>
